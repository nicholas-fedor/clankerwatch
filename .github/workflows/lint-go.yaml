---
name: Lint Go

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/lint-go.yaml
      - internal/**
      - tools/**
      - plasmoid/**
      - build/golangci-lint/**
      - build/package/**
      - go.mod
      - go.sum
      - main.go
      - Taskfile.yml

permissions:
  contents: read # Set default read-only permissions

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Run Golangci-lint, Betteralign, Modernize, and Policy Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read # For code checkout
      pull-requests: read # For golangci-lint annotations
    steps:
      - name: Harden the Runner (Step Security)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache: true
          cache-dependency-path: "**/go.sum"
          go-version-file: go.mod

      - name: Setup Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.x

      # The config sets issues.fix, which applies fixes and hides the issues
      # they resolve. --fix=false makes CI report them instead.
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          args: --timeout=5m --config=build/golangci-lint/golangci-lint.yaml --fix=false
          only-new-issues: false

      # betteralign replaces govet's fieldalignment, which deletes struct
      # field comments. This is the check half of `task lint`. It tracks the
      # latest release so its type checker keeps up with the Go toolchain.
      - name: Run betteralign
        run: |
          go install github.com/dkorunic/betteralign/cmd/betteralign@latest
          betteralign ./...

      - name: Run go fix Modernizers
        run: task modernize

      - name: Run Policy Checks
        run: task policy-check
