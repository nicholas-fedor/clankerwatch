---
name: Run Tests and Upload Coverage

on:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        description: "Token for uploading the coverage report to Codecov"
        required: false
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/test.yaml
      - internal/**
      - tools/**
      - go.mod
      - go.sum
      - main.go
      - Taskfile.yml

permissions:
  contents: read # Set default read-only permissions

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Run Tests and Upload Coverage Report
    # clankerwatch is Linux only, so one platform covers it.
    runs-on: ubuntu-latest
    steps:
      - name: Harden the Runner (Step Security)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache: true
          cache-dependency-path: "**/go.sum"
          go-version-file: go.mod

      - name: Setup Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.x

      # The bus tests start private dbus-daemon instances and skip without
      # one. Failing here keeps them from passing silently as skips.
      - name: Install dbus-daemon
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends dbus
          command -v dbus-daemon

      - name: Install Dependencies
        run: go mod download

      - name: Run Tests
        run: task test

      - name: Upload Coverage Report to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
