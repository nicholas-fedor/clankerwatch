---
name: Build Release

on:
  workflow_call:
    inputs:
      ENVIRONMENT:
        description: "GitHub environment for secrets access"
        required: true
        type: string
      DRY_RUN:
        description: "Build a snapshot without publishing artifacts"
        required: false
        default: false
        type: boolean

permissions:
  contents: read # Declare default permissions as read only.

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    environment: ${{ inputs.ENVIRONMENT }}
    env:
      CGO_ENABLED: 0
    permissions:
      contents: write # For code checkout and publishing releases
      attestations: write # For generating build provenance
      id-token: write # For keyless Sigstore signing and attestations

    steps:
      - name: Harden the Runner (Step Security)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          cache: false # Disable to prevent cache poisoning
          go-version-file: go.mod

      - name: Install Syft for SBOM generation
        uses: anchore/sbom-action/download-syft@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4

      - name: Install Cosign
        uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4

      # A dry run builds a snapshot, which needs no tag and publishes nothing.
      # The checksums are still signed, which exercises the cosign setup.
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          distribution: goreleaser
          version: "~> v2"
          args: >-
            release
            --config build/goreleaser/goreleaser.yaml
            --clean
            ${{ inputs.DRY_RUN && '--snapshot' || '' }}

      - name: Generate Artifact Attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: ${{ !inputs.DRY_RUN }}
        with:
          subject-checksums: ./dist/checksums.txt

      - name: Cleanup dist Directory
        if: always()
        run: rm -rf dist
