---
name: Build Release

on:
  workflow_call:
    inputs:
      ENVIRONMENT:
        description: "GitHub environment for secrets access"
        required: true
        type: string
      DRY_RUN:
        description: "Build a snapshot without publishing artifacts"
        required: false
        default: false
        type: boolean

permissions:
  contents: read # Declare default permissions as read only.

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    environment: ${{ inputs.ENVIRONMENT }}
    env:
      CGO_ENABLED: 0
    permissions:
      contents: write # For code checkout and publishing releases
      attestations: write # For generating build provenance
      id-token: write # For keyless Sigstore signing and attestations

    steps:
      - name: Harden the Runner (Step Security)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache: false # Disable to prevent cache poisoning
          go-version-file: go.mod

      - name: Install Syft for SBOM generation
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # A dry run builds a snapshot, which needs no tag and publishes nothing.
      # The checksums are still signed, which exercises the cosign setup.
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          distribution: goreleaser
          version: "~> v2"
          args: >-
            release
            --config build/goreleaser/goreleaser.yaml
            --clean
            ${{ inputs.DRY_RUN && '--snapshot' || '' }}

      - name: Generate Artifact Attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: ${{ !inputs.DRY_RUN }}
        with:
          subject-checksums: ./dist/checksums.txt

      - name: Cleanup dist Directory
        if: always()
        run: rm -rf dist
